[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "edgevision"
version = "1.0.0"
description = "Modular real-time object detection pipeline for resource-constrained edge Linux devices"
requires-python = ">=3.10"
dependencies = ["numpy", "opencv-python-headless", "onnxruntime", "ai-edge-litert"]

[project.scripts]
edgevision = "edgevision.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
